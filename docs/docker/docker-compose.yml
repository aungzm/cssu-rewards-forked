# Single-image Spring + React deployment. Publish the image first, or build it
# locally and set APP_IMAGE to that local tag. See README.md.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/aungzm/cssu-rewards-forked:demo}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      DEMO_MODE: "${DEMO_MODE:-true}"
      DATABASE_URL: "${DATABASE_URL:-jdbc:sqlite:/data/rewards.db}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random bytes}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - app_data:/data

volumes:
  app_data:
