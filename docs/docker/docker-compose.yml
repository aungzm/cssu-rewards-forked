# Deployment sample for the proposed combined Spring + React image.
# SQLite works in Spring; image packaging and frontend integration are pending.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/aungzm/cssu-rewards-forked:demo}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      DEMO_MODE: "${DEMO_MODE:-true}"
      SPRING_PROFILES_ACTIVE: sqlite
      SQLITE_URL: jdbc:sqlite:/data/rewards.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random bytes}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - app_data:/data

volumes:
  app_data:
