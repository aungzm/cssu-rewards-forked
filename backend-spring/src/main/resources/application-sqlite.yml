spring:
  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:./rewards.db}
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      # SQLite has no SELECT FOR UPDATE. A single connection serializes complete
      # service transactions, including their reads, within this app instance.
      maximum-pool-size: 1
      minimum-idle: 1
      data-source-properties:
        foreign_keys: true
        journal_mode: WAL
        busy_timeout: 10000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Keep these outside db/migration so PostgreSQL never discovers them.
    locations: classpath:db/sqlite
