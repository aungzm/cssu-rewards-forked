server:
  port: 3001

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/cssu_rewards_spring}}
    username: ${DATABASE_USER:${DB_USER:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  demo-mode: ${DEMO_MODE:false}
